<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voir Mail type pour le Bourgmestre</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #f9f9f9;
    }
    .big-button {
      display: inline-block;
      font-size: 1.2em;
      padding: 1em 2em;
      width: 90%;
      max-width: 300px;
      text-align: center;
      border: none;
      border-radius: 8px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
    }
    @media (min-width: 600px) {
      .big-button {
        font-size: 1.4em;
        padding: 1.2em 2.5em;
      }
    }
  </style>
</head>
<body>
  <button class="big-button" id="sendMail">Voir mail type pour Bourgmestre</button>
  <script>
    // Paramètres du mail
    var to = "kabinet.ph.close@brucity.be";
    var cc = "cabinet.a.maes@brucity.be,stoprodeoatomium@gmail.com";
    var subject = "Stop à la folie des rodéos!";
    var body = `Monsieur le Bourgmestre,

J’habite à Laeken et je vous écris car je suis victime de nuisances sonores causées par des rodéos urbains. Aujourd’hui encore, ces individus ont fait hurler leurs moteurs aussi fort que possible dans le seul but d'irriter au maximum les riverains. Ces rodéos durent des heures, souvent jusqu’après minuit.

Notre quartier est soumis à ces nuisances depuis des années et je suis profondément excédé par cette situation. En plus du vacarme parfois insupportable, je crains aussi des blessures physiques, voire pire, à cause de ce comportement asocial et dangereux.

Les mesures que vous avez prises jusqu’à présent pour contenir ce problème ne sont pas efficaces. Les auteurs de ces rodéos, notamment les motards, sont toujours présents.

J’attends des mesures immédiates avec des résultats probants.

J'ajoute le collectif Stop Rodeo Atomium en tant que destinataire de ce mail.

Cordialement,`;

    // Construction du lien mailto avec encodage
    var link = "mailto:" + to
      + "?cc=" + encodeURIComponent(cc)
      + "&subject=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(body);

    document.getElementById('sendMail').addEventListener('click', function() {
      window.location.href = link;
    });
  </script>
</body>
</html>
